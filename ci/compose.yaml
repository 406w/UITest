name: erp-uitest-ci
services:
  agent:
    build:
      context: ..
      dockerfile: ci/Dockerfile.agent
    image: erp-uitest-agent:local
    restart: unless-stopped
    init: true
    environment:
      JENKINS_URL: ${JENKINS_URL:-http://host.docker.internal:8080}
      JENKINS_AGENT_NAME: erp-uitest-linux
      JENKINS_WEB_SOCKET: "true"
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - jenkins_agent_secret
    volumes:
      - agent-work:/home/jenkins/agent
    depends_on:
      selenium:
        condition: service_healthy
  selenium:
    image: selenium/standalone-chrome@sha256:7efe71e7e4a83bdf574b26bd354690928075e8f443223d2ced16a2c208eae1d7
    restart: unless-stopped
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: "1"
      SE_NODE_SESSION_TIMEOUT: "180"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
secrets:
  jenkins_agent_secret:
    file: ./jenkins/secrets/agent-secret
volumes:
  agent-work:
