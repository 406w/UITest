[pytest]
testpaths = testcase
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
required_plugins = allure-pytest
log_level = INFO
# 直接 pytest、IDE 和 main.py 均使用此配置；默认每次输出独立目录。
erp_report_dir = report
erp_report_html = true
# 当前机器的 Allure；其他环境可用 ALLURE_CLI / --allure-cli 覆盖，留空则查 PATH。
erp_allure_cli = G:/Python/allure/allure-2.45.0/bin/allure.bat
markers =
    smoke: 登录、退出和订单核心场景
    ui: 需要浏览器与 ERP 服务
